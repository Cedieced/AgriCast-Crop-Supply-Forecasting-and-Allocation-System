services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysqlroot
      MYSQL_DATABASE: crop_supply
      MYSQL_USER: cropapp
      MYSQL_PASSWORD: cropapp
    ports:
      - "3306:3306"
    volumes:
      - crop_supply_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  crop_supply_mysql_data:
